<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page Title</title>
    <meta name="description" content="Roughly 155 characters">
    <script src="scripts.js"></script>
</head>
<body>

    <h1>Hello World</h1>

    <div style="display: grid; grid-template-columns: 4fr 1fr 1fr; gap: 5px; margin-top: 5px;">
        <input id="txtBox" type="text" style="font-size: 25px;">
        <button class="btn-click" onclick="huwasisa(this.value)" value="bkspc">bkspc</button>
        <button class="btn-click" onclick="huwastanan(this.value)" value="AC">AC</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 5px;">
        <button class="btn-click" onclick="punanletter(this.value)" value="7">7</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="8">8</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="9">9</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="/">/</button>
        
        <button class="btn-click" onclick="punanletter(this.value)" value="4">4</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="5">5</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="6">6</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="*">*</button>
        
        <button class="btn-click" onclick="punanletter(this.value)" value="1">1</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="2">2</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="3">3</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="-">-</button>
        
        <button class="btn-click" onclick="punanletter(this.value)" value=".">.</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="0">0</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="=">=</button>
        <button class="btn-click" onclick="punanletter(this.value)" value="+">+</button>
    </div>

</body>
</html>
